<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>TOKEN TERROR</title>
<style>
  :root { --org:#ff8a1f; --grn:#3dff8a; --red:#ff3355; --pur:#b36bff; --bg:#05020a; }
  * { box-sizing:border-box; margin:0; padding:0; }
  html,body { width:100%; height:100%; background:var(--bg); overflow:hidden; color:#e9e4f5;
    font-family:'SF Mono',Menlo,Consolas,'Courier New',monospace; user-select:none; }
  #game { position:fixed; inset:0; }
  #game canvas { display:block; }
  body.muse #game canvas { animation:jitter .35s steps(2) infinite; }
  @keyframes jitter {
    0%{transform:translate(0,0);filter:hue-rotate(0)}
    25%{transform:translate(-2px,1px);filter:hue-rotate(25deg) saturate(.7)}
    50%{transform:translate(2px,-1px);filter:hue-rotate(-20deg) saturate(.6)}
    75%{transform:translate(-1px,-2px);filter:hue-rotate(10deg) saturate(.8)}
    100%{transform:translate(1px,2px);filter:hue-rotate(0) saturate(.7)}
  }
  #fx { position:fixed; inset:0; pointer-events:none; z-index:2;
    background:radial-gradient(ellipse at center, transparent 45%, rgba(0,0,0,.65) 100%); }
  body.muse #fx { background:
      repeating-linear-gradient(0deg, rgba(0,0,0,.28) 0 2px, transparent 2px 4px),
      radial-gradient(ellipse at center, transparent 20%, rgba(10,0,20,.92) 100%); }
  #flash { position:fixed; inset:0; pointer-events:none; z-index:3; opacity:0; background:#fff; }
  #hud { position:fixed; inset:0; pointer-events:none; z-index:4; display:none; }
  #left { position:absolute; top:18px; left:20px; width:min(340px,60vw); }
  .label { font-size:12px; letter-spacing:.18em; color:#a99cc4; display:flex; justify-content:space-between; }
  #mode { color:var(--org); font-weight:700; }
  body.muse #mode { color:var(--pur); animation:blink .5s steps(2) infinite; }
  @keyframes blink { 50%{opacity:.3} }
  #bar { height:16px; margin-top:6px; border:1px solid #5b4a7a; background:#120a1e; position:relative; }
  #fill { height:100%; width:100%; background:linear-gradient(90deg,#ff5a00,var(--org)); box-shadow:0 0 12px var(--org); transition:width .1s linear; }
  #bar.gain { border-color:#fff; box-shadow:0 0 14px rgba(255,138,31,.9); }
  #bar.gain #fill { filter:brightness(1.7); }
  #bar.low #fill { background:linear-gradient(90deg,#ff0033,#ff3355); box-shadow:0 0 14px var(--red); animation:blink .4s steps(2) infinite; }
  #tokNum { font-size:26px; font-weight:700; margin-top:4px; color:var(--org); text-shadow:0 0 10px rgba(255,138,31,.6); }
  body.muse #tokNum { color:var(--pur); text-shadow:0 0 10px rgba(179,107,255,.6); font-size:16px; }
  #hearts { font-size:22px; margin-top:6px; letter-spacing:4px; filter:drop-shadow(0 0 6px rgba(255,51,85,.7)); }
  #right { position:absolute; top:18px; right:20px; text-align:right; }
  #score { font-size:34px; font-weight:700; color:#fff; text-shadow:0 0 12px rgba(255,255,255,.35); }
  #meta { font-size:12px; letter-spacing:.14em; color:#a99cc4; margin-top:2px; line-height:1.6; }
  #combo { color:var(--grn); font-weight:700; }
  #banner { position:absolute; top:26%; left:0; right:0; text-align:center; opacity:0; transition:opacity .25s; padding:0 20px; }
  #banner.show { opacity:1; }
  #banner h1 { font-size:clamp(28px,6vw,64px); letter-spacing:.12em; text-shadow:0 0 24px currentColor; }
  #banner p { margin-top:10px; font-size:clamp(13px,1.8vw,18px); color:#d8cff0; }
  #whisper { position:absolute; bottom:70px; left:0; right:0; text-align:center; color:var(--pur); font-size:15px; opacity:0; transition:opacity .4s; text-shadow:0 0 10px rgba(179,107,255,.6); padding:0 20px; }
  #whisper.show { opacity:1; }
  #hint { position:absolute; bottom:16px; left:0; right:0; text-align:center; font-size:11px; letter-spacing:.14em; color:#7d7096; }
  #lesson { position:absolute; left:20px; bottom:104px; width:min(400px,86vw); padding:12px 14px; font-size:13px; line-height:1.55;
    background:rgba(10,24,16,.88); border:1px solid var(--grn); color:#d9ffe8; opacity:0; transform:translateY(8px); transition:all .3s; box-shadow:0 0 16px rgba(61,255,138,.25); }
  #lesson.show { opacity:1; transform:none; }
  #lesson b { display:block; color:var(--grn); letter-spacing:.14em; font-size:11px; margin-bottom:4px; }
  #ticker { position:absolute; left:0; right:0; bottom:40px; text-align:center; font-size:12px; color:#7d7096; }
  #ticker .chip { display:inline-block; white-space:pre; margin:0 2px; padding:2px 6px; color:#000; font-weight:700; border-radius:3px; }
  .quiz-opt { display:block; width:100%; margin-top:10px; text-align:left; font-size:14px; letter-spacing:.04em; padding:12px 16px; }
  .why { margin-top:16px; text-align:left; font-size:14px; line-height:1.65; color:#d9ffe8; border:1px solid var(--grn); padding:12px 16px; background:rgba(10,24,16,.8); }
  html,body { overscroll-behavior:none; -webkit-touch-callout:none; }
  #touch { position:fixed; inset:0; z-index:5; display:none; touch-action:none; }
  body.touch #touch { display:block; }
  .zone { position:absolute; top:0; bottom:0; touch-action:none; }
  #zL { left:0; width:50%; } #zR { right:0; width:50%; }
  .stick { position:fixed; z-index:5; width:120px; height:120px; margin:-60px 0 0 -60px; border-radius:50%; display:none; pointer-events:none;
    border:2px solid rgba(255,138,31,.6); background:rgba(255,138,31,.1); }
  .stick i { position:absolute; left:50%; top:50%; width:52px; height:52px; margin:-26px 0 0 -26px; border-radius:50%; background:rgba(255,138,31,.6); }
  #stR { border-color:rgba(61,255,138,.6); background:rgba(61,255,138,.1); } #stR i { background:rgba(61,255,138,.6); }
  #pauseBtn { display:none; position:absolute; top:10px; left:50%; transform:translateX(-50%); margin:0; padding:6px 14px; font-size:14px; letter-spacing:0; }
  body.touch #pauseBtn { display:block; }
  #touchHint { position:fixed; z-index:5; bottom:22px; left:0; right:0; display:none; justify-content:space-around; pointer-events:none;
    font-size:11px; letter-spacing:.14em; color:rgba(233,228,245,.55); animation:hintfade 6s forwards; }
  body.touch.playing #touchHint { display:flex; }
  @keyframes hintfade { 0%,70%{opacity:1} 100%{opacity:0} }
  .overlay { overflow-y:auto; } .card { margin:auto; }
  .overlay { position:fixed; inset:0; z-index:6; display:flex; align-items:center; justify-content:center;
    background:rgba(5,2,10,.78); text-align:center; padding:20px; }
  .overlay.hidden { display:none; }
  .card { max-width:640px; }
  .card h1 { font-size:clamp(40px,9vw,96px); line-height:.95; letter-spacing:.06em; color:var(--org);
    text-shadow:0 0 30px rgba(255,138,31,.7), 3px 0 0 rgba(255,51,85,.6), -3px 0 0 rgba(61,255,138,.35); animation:flick 3.2s infinite; }
  @keyframes flick { 0%,92%,100%{opacity:1} 94%{opacity:.4} 96%{opacity:1} 97%{opacity:.6} }
  .card .tag { margin-top:14px; font-size:15px; color:#c8bde0; letter-spacing:.08em; text-wrap:balance; }
  .rules { margin:22px auto 0; text-align:left; font-size:13px; line-height:1.75; color:#cfc6e6; border:1px solid #3a2b55; padding:14px 18px; background:rgba(18,10,30,.7); }
  .rules b.c { color:var(--org); } .rules b.m { color:var(--pur); } .rules b.g { color:var(--grn); }
  button { margin-top:24px; font:inherit; font-size:16px; letter-spacing:.2em; padding:14px 32px; cursor:pointer;
    background:transparent; color:var(--org); border:2px solid var(--org); pointer-events:auto; box-shadow:0 0 18px rgba(255,138,31,.4); transition:all .15s; }
  button:hover { background:var(--org); color:#000; }
  .big { font-size:clamp(30px,6vw,56px); font-weight:700; color:#fff; }
  .stat { margin-top:8px; color:#c8bde0; font-size:15px; letter-spacing:.1em; }
  .best { color:var(--grn); }
  .flavor { margin-top:20px; color:var(--pur); font-size:14px; font-style:italic; }
  .mbr { display:none; }
  @media (max-width:700px) {
    .mbr { display:inline; }
    #left { top:10px; left:10px; width:50vw; } .label { font-size:10px; } #tokNum { font-size:20px; }
    body.muse #tokNum { font-size:11px; } #hearts { font-size:18px; margin-top:2px; }
    #right { top:10px; right:10px; } #score { font-size:24px; } #meta { font-size:10px; }
    #lesson { left:10px; top:114px; bottom:auto; width:calc(100vw - 20px); font-size:12px; padding:10px 12px; }
    #ticker { bottom:58px; font-size:10px; } #whisper { bottom:92px; font-size:12px; }
    #pauseBtn { top:62px; right:10px; left:auto; transform:none; padding:4px 12px; }
    #banner { top:22%; } #banner h1 { font-size:26px; } #banner p { font-size:12px; }
    #hint { display:none; }
    .overlay { padding:14px; } .rules { font-size:12px; line-height:1.6; padding:10px 12px; margin-top:14px; }
    .card .tag { font-size:13px; margin-top:8px; } .quiz-opt { font-size:13px; padding:12px; } .why { font-size:12px; }
    .big { font-size:30px; } .stat { font-size:13px; }
    button { padding:12px 22px; font-size:14px; margin-top:16px; }
  }
  @media (max-height:520px) and (orientation:landscape) {
    #lesson { bottom:70px; width:300px; font-size:11px; } #ticker { display:none; }
    .rules { font-size:11px; line-height:1.5; } .card h1 { font-size:36px; }
  }
</style>
</head>
<body>
<div id="game"></div>
<div id="fx"></div>
<div id="flash"></div>

<div id="hud">
  <div id="left">
    <div class="label"><span>CONTEXT TOKENS</span><span id="mode">CLAUDE MODE</span></div>
    <div id="bar"><div id="fill"></div></div>
    <div id="tokNum">100</div>
    <div id="hearts"></div>
  </div>
  <div id="right">
    <div id="score">0</div>
    <div id="meta">WAVE <span id="wave">1</span> &nbsp;·&nbsp; BEST <span id="best">0</span><br><span id="combo"></span></div>
  </div>
  <div id="banner"><h1 id="bh"></h1><p id="bp"></p></div>
  <div id="whisper"></div>
  <button id="pauseBtn">&#10074;&#10074;</button>
  <div id="lesson"></div>
  <div id="ticker"></div>
  <div id="hint">WASD / ARROWS MOVE &nbsp;·&nbsp; MOUSE AIM &nbsp;·&nbsp; HOLD CLICK / SPACE FIRE &nbsp;·&nbsp; P PAUSE &nbsp;·&nbsp; M MUTE</div>
</div>

<div id="touch"><div class="zone" id="zL"></div><div class="zone" id="zR"></div></div>
<div class="stick" id="stL"><i></i></div><div class="stick" id="stR"><i></i></div>
<div id="touchHint"><span>&#9664; MOVE</span><span>AIM + FIRE &#9654;</span></div>
<div id="screen" class="overlay"></div>

<script src="three.min.js"></script>
<script>
(() => {
'use strict';
const $ = id => document.getElementById(id);
const rand = (a, b) => a + Math.random() * (b - a);
const lerp = (a, b, t) => a + (b - a) * t;
const ARENA = 26;
const TAU = Math.PI * 2;

/* ---------- maze (13x13 cells; '#' wall, '.' open) ---------- */
const MAZE = [
  '.............',
  '.###..#..###.',
  '.#.........#.',
  '.#.##...##.#.',
  '......#......',
  '.##.#...#.##.',
  '.#.........#.',
  '.##.#...#.##.',
  '......#......',
  '.#.##...##.#.',
  '.#.........#.',
  '.###..#..###.',
  '.............',
];
const N = MAZE.length, CELL = ARENA * 2 / N;
const wallAt = (cx, cz) => cx < 0 || cz < 0 || cx >= N || cz >= N || MAZE[cz][cx] === '#';
const cellOf = v => Math.floor((v + ARENA) / CELL);
const cellCenter = c => -ARENA + CELL * (c + .5);
const openCells = [];
for (let cz = 0; cz < N; cz++) for (let cx = 0; cx < N; cx++) if (!wallAt(cx, cz)) openCells.push({ cx, cz });
function hitsWall(x, z, r) {
  const x0 = cellOf(x - r), x1 = cellOf(x + r), z0 = cellOf(z - r), z1 = cellOf(z + r);
  for (let cz = z0; cz <= z1; cz++) for (let cx = x0; cx <= x1; cx++) {
    if (!wallAt(cx, cz)) continue;
    const nx = Math.max(-ARENA + cx * CELL, Math.min(x, -ARENA + (cx + 1) * CELL));
    const nz = Math.max(-ARENA + cz * CELL, Math.min(z, -ARENA + (cz + 1) * CELL));
    if ((x - nx) ** 2 + (z - nz) ** 2 < r * r) return true;
  }
  return false;
}

/* ---------- three setup ---------- */
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
$('game').appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x05020a);
scene.fog = new THREE.FogExp2(0x05020a, 0.018);
const camera = new THREE.PerspectiveCamera(50, innerWidth / innerHeight, 0.1, 200);
camera.position.set(0, 24, 14);
camera.fov = innerWidth < innerHeight ? 78 : 50; camera.updateProjectionMatrix();

const ambient = new THREE.AmbientLight(0x442266, 0.7);
scene.add(ambient);
const moon = new THREE.DirectionalLight(0x7788ff, 0.4);
moon.position.set(-10, 30, 10);
scene.add(moon);
const pLight = new THREE.PointLight(0xff8a1f, 2.2, 30, 1.4);
scene.add(pLight);

// ground + terminal grid
const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(260, 260),
  new THREE.MeshStandardMaterial({ color: 0x0b0714, roughness: 1 })
);
ground.rotation.x = -Math.PI / 2;
scene.add(ground);
const grid = new THREE.GridHelper(ARENA * 2, 26, 0x1fff7a, 0x0a4a2a);
grid.position.y = 0.02;
grid.material.transparent = true; grid.material.opacity = 0.55;
scene.add(grid);
const border = new THREE.LineLoop(
  new THREE.BufferGeometry().setFromPoints([
    new THREE.Vector3(-ARENA, .06, -ARENA), new THREE.Vector3(ARENA, .06, -ARENA),
    new THREE.Vector3(ARENA, .06, ARENA), new THREE.Vector3(-ARENA, .06, ARENA)]),
  new THREE.LineBasicMaterial({ color: 0x3dff8a })
);
scene.add(border);

// neon maze walls
const wallMat = new THREE.MeshStandardMaterial({ color: 0x140c24, emissive: 0x0a0618, roughness: .8 });
const edgeMat = new THREE.LineBasicMaterial({ color: 0x3dff8a });
const wallGeo = new THREE.BoxGeometry(CELL - .1, 1.2, CELL - .1), edgeGeo = new THREE.EdgesGeometry(wallGeo);
for (let cz = 0; cz < N; cz++) for (let cx = 0; cx < N; cx++) {
  if (MAZE[cz][cx] !== '#') continue;
  const w = new THREE.Mesh(wallGeo, wallMat), e = new THREE.LineSegments(edgeGeo, edgeMat);
  w.position.set(cellCenter(cx), .6, cellCenter(cz)); e.position.copy(w.position);
  scene.add(w, e);
}
let gainT = 0;
const pelletGeo =new THREE.SphereGeometry(.22, 8, 6), pelletMat = new THREE.MeshBasicMaterial({ color: 0xffc27a });
function spawnPellets() {
  for (const c of openCells) {
    if (c.cx === 6 && c.cz === 6) continue;
    const m = new THREE.Mesh(pelletGeo, pelletMat);
    m.position.set(cellCenter(c.cx), .5, cellCenter(c.cz));
    scene.add(m); pellets.push({ mesh: m });
  }
}
function randomOpen(minDist) {
  for (let i = 0; i < 30; i++) {
    const c = openCells[(Math.random() * openCells.length) | 0], x = cellCenter(c.cx), z = cellCenter(c.cz);
    if (!minDist || Math.hypot(x - player.position.x, z - player.position.z) > minDist) return new THREE.Vector3(x, 0, z);
  }
  return new THREE.Vector3(cellCenter(0), 0, cellCenter(0));
}
// BFS flow field so ghosts path through corridors toward the player
const DIRS = [[1, 0], [-1, 0], [0, 1], [0, -1]];
let flow = null, flowKey = '';
function updateFlow() {
  const pc = cellOf(player.position.x), pz = cellOf(player.position.z), key = pc + ',' + pz;
  if (key === flowKey) return; flowKey = key;
  flow = Array.from({ length: N }, () => new Array(N).fill(-1));
  if (wallAt(pc, pz)) return;
  const q = [[pc, pz]]; flow[pz][pc] = 0;
  for (let i = 0; i < q.length; i++) {
    const [x, z] = q[i];
    for (const [dx, dz] of DIRS) {
      const nx = x + dx, nz = z + dz;
      if (wallAt(nx, nz) || flow[nz][nx] >= 0) continue;
      flow[nz][nx] = flow[z][x] + 1; q.push([nx, nz]);
    }
  }
}
const chase = { x: 0, z: 0 };
function chaseDir(pos, toX, toZ, d) {
  chase.x = toX / d; chase.z = toZ / d;
  const cx = cellOf(pos.x), cz = cellOf(pos.z);
  if (!flow || wallAt(cx, cz) || flow[cz][cx] <= 0) return chase;   // same cell as player: go straight
  let best = null, bd = flow[cz][cx];
  for (const [dx, dz] of DIRS) {
    const nx = cx + dx, nz = cz + dz;
    if (!wallAt(nx, nz) && flow[nz][nx] >= 0 && flow[nz][nx] < bd) { bd = flow[nz][nx]; best = [nx, nz]; }
  }
  if (best) {
    const tx = cellCenter(best[0]) - pos.x, tz = cellCenter(best[1]) - pos.z, l = Math.hypot(tx, tz) || 1;
    chase.x = tx / l; chase.z = tz / l;
  }
  return chase;
}

// graveyard decor outside the arena + corner jack-o-lanterns
const stoneMat = new THREE.MeshStandardMaterial({ color: 0x2a2438, roughness: .9 });
for (let i = 0; i < 70; i++) {
  const a = rand(0, TAU), r = rand(ARENA * 1.42, ARENA * 2.4);
  const x = Math.cos(a) * r, z = Math.sin(a) * r;
  if (Math.abs(x) < ARENA + 3 && Math.abs(z) < ARENA + 3) continue;
  const h = rand(1.2, 3);
  const s = new THREE.Mesh(new THREE.BoxGeometry(rand(.9, 1.6), h, .35), stoneMat);
  s.position.set(x, h / 2, z);
  s.rotation.set(rand(-.15, .15), rand(0, TAU), rand(-.2, .2));
  scene.add(s);
}
function pumpkin(scale = 1) {
  const g = new THREE.Group();
  const m = new THREE.MeshStandardMaterial({ color: 0xff7a10, emissive: 0xff5500, emissiveIntensity: .7, roughness: .6 });
  const b = new THREE.Mesh(new THREE.SphereGeometry(1, 16, 12), m);
  b.scale.set(1, .82, 1); g.add(b);
  const stem = new THREE.Mesh(new THREE.CylinderGeometry(.12, .18, .4, 6), new THREE.MeshStandardMaterial({ color: 0x2f5a1a }));
  stem.position.y = .85; g.add(stem);
  const eyeM = new THREE.MeshBasicMaterial({ color: 0xffe066 });
  for (const sx of [-1, 1]) {
    const e = new THREE.Mesh(new THREE.ConeGeometry(.2, .3, 3), eyeM);
    e.position.set(sx * .38, .15, .88); e.rotation.x = Math.PI / 2; e.rotation.z = Math.PI; g.add(e);
  }
  const mouth = new THREE.Mesh(new THREE.BoxGeometry(.7, .14, .1), eyeM);
  mouth.position.set(0, -.3, .92); g.add(mouth);
  g.scale.setScalar(scale);
  return g;
}
const cornerLights = [];
for (const [sx, sz] of [[-1, -1], [1, -1], [-1, 1], [1, 1]]) {
  const p = pumpkin(1.6); p.position.set(sx * (ARENA + 2), 1.3, sz * (ARENA + 2));
  p.rotation.y = Math.atan2(-sx, -sz); scene.add(p);
  const l = new THREE.PointLight(0xff6a00, 1.2, 22, 1.6); l.position.set(sx * (ARENA + 1), 3, sz * (ARENA + 1));
  scene.add(l); cornerLights.push(l);
}

/* ---------- player ---------- */
const player = new THREE.Group();
{
  // Clawd-style blocky orange mascot: wide body, square eyes, nub arms, four legs
  const skin = new THREE.MeshStandardMaterial({ color: 0xd97757, emissive: 0xd97757, emissiveIntensity: .35, roughness: .7 });
  const box = (w, h, d, x, y, z, mat) => { const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat); m.position.set(x, y, z); player.add(m); return m; };
  box(2.2, 1.35, 1.3, 0, 1.45, 0, skin);               // body
  box(.5, .55, .6, -1.35, 1.2, 0, skin);               // arms
  box(.5, .55, .6, 1.35, 1.2, 0, skin);
  const eyeM = new THREE.MeshBasicMaterial({ color: 0x120a0a });
  box(.28, .4, .1, -.5, 1.6, .67, eyeM);               // eyes (face +z)
  box(.28, .4, .1, .5, 1.6, .67, eyeM);
  const legs = [];
  for (const x of [-.8, -.27, .27, .8]) legs.push(box(.3, .8, .35, x, .4, 0, skin));
  player.userData.legs = legs; player.userData.skin = skin;
  const cursor = new THREE.Mesh(new THREE.BoxGeometry(.12, .4, .12), new THREE.MeshBasicMaterial({ color: 0x3dff8a }));
  cursor.position.set(1.2, 2.5, .5); player.add(cursor);
  player.userData.cursor = cursor;
}
scene.add(player);

/* ---------- state ---------- */
const TYPES = {
  limit:    { r: .95, hp: 2, speed: 2.7, color: 0xe6e6ff, score: 10 },
  e429:     { r: .7,  hp: 1, speed: 5.0, color: 0xff3355, score: 15 },
  overflow: { r: 1.7, hp: 9, speed: 1.7, color: 0xb36bff, score: 60, split: true },
};
let state = 'title', paused = false;
let G;
let best = 0;
try { best = +localStorage.getItem('tokenTerrorBest') || 0; } catch (e) {}
const enemies = [], bullets = [], orbs = [], parts = [], pellets = [];
const keys = {};
let mouseDown = false;
const mouseNDC = new THREE.Vector2(0, 0);
const aimPoint = new THREE.Vector3(0, 0, -5);
const raycaster = new THREE.Raycaster();
const groundPlane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0);

function newGame() {

let ac = null, muted = false;
function beep(f, d = .1, type = 'square', v = .04, slide = 0) {
  if (muted) return;
  try {
    ac = ac || new (window.AudioContext || window.webkitAudioContext)();
    const o = ac.createOscillator(), g = ac.createGain(), n = ac.currentTime;
    o.type = type; o.frequency.setValueAtTime(f, n);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, f + slide), n + d);
    g.gain.setValueAtTime(v, n); g.gain.exponentialRampToValueAtTime(.0001, n + d);
    o.connect(g); g.connect(ac.destination); o.start(n); o.stop(n + d);
  } catch (e) {}
}

function ghostMesh(color, r) {
  const g = new THREE.Group();
  const mat = new THREE.MeshStandardMaterial({ color, emissive: color, emissiveIntensity: .55, roughness: .6, side: THREE.DoubleSide });
  const top = new THREE.Mesh(new THREE.SphereGeometry(1, 14, 10, 0, TAU, 0, Math.PI / 2), mat); top.position.y = 1;
  const body = new THREE.Mesh(new THREE.CylinderGeometry(1, 1, 1, 14, 1, true), mat); body.position.y = .5;
  const hem = new THREE.Mesh(new THREE.TorusGeometry(1, .12, 6, 14), mat); hem.rotation.x = Math.PI / 2; hem.position.y = 0;
  const eyeM = new THREE.MeshBasicMaterial({ color: 0x000000 });
  for (const sx of [-1, 1]) {
    const e = new THREE.Mesh(new THREE.SphereGeometry(.2, 8, 6), eyeM);
    e.position.set(sx * .38, 1.05, .82); e.scale.y = 1.4; g.add(e);
  }
  g.add(top, body, hem);
  g.scale.setScalar(r);
  return g;
}

function bindStick(zone, stick, onMove, onEnd) {
  let id = null, ox = 0, oy = 0; const R = 55, knob = stick.firstChild;
  const place = (dx, dy) => { knob.style.transform = `translate(${dx}px,${dy}px)`; };
  zone.addEventListener('touchstart', e => {
    e.preventDefault();
    if (id !== null) return;
    const t = e.changedTouches[0]; id = t.identifier; ox = t.clientX; oy = t.clientY;
    stick.style.display = 'block'; stick.style.left = ox + 'px'; stick.style.top = oy + 'px'; place(0, 0);
  }, { passive: false });
  zone.addEventListener('touchmove', e => {
    e.preventDefault();
    for (const t of e.changedTouches) {
      if (t.identifier !== id) continue;
      let dx = t.clientX - ox, dy = t.clientY - oy; const l = Math.hypot(dx, dy);
      if (l > R) { dx = dx / l * R; dy = dy / l * R; }
      place(dx, dy); onMove(dx / R, dy / R);
    }
  }, { passive: false });
  const end = e => {
    for (const t of e.changedTouches) if (t.identifier === id) { id = null; stick.style.display = 'none'; onEnd(); }
  };
  zone.addEventListener('touchend', end); zone.addEventListener('touchcancel', end);
}

  scene.remove(e.mesh); enemies.splice(i, 1);
  const T = TYPES[e.type];
  G.kills++; G.combo++; G.comboT = 2.5;
  G.score += T.score * (e.small ? .5 : 1) * (1 + Math.min(G.combo, 30) / 10);
  burst(e.mesh.position, T.color, e.type === 'overflow' ? 24 : 12, 7);
  beep(rand(180, 260), .12, 'triangle', .05, -100);
  if (T.split) for (let k = 0; k < 3; k++) {
    const off = new THREE.Vector3(rand(-1.5, 1.5), 0, rand(-1.5, 1.5)).add(e.mesh.position);
    if (hitsWall(off.x, off.z, .7)) off.copy(e.mesh.position);
    spawnEnemy('limit', off, true);
  }
  if (Math.random() < (G.muse ? .5 : .32)) spawnOrb(false, e.mesh.position);
}

function update(dt) {
  G.t += dt;
  const muse = G.muse;
  G.mv = lerp(G.mv, muse ? 1 : 0, 1 - Math.exp(-4 * dt));
  const wave = 1 + Math.floor(G.t / 20);
  if (wave !== G.wave) {
    G.wave = wave;
    if (wave === 2) teach('ctx', 'THE CONTEXT TAX', 'Notice the drain getting faster? Every turn re-reads the whole conversation, so long chats cost more. Keep chats focused, and /compact when they bloat.');
    banner('WAVE ' + wave, wave % 4 === 0 ? 'Context window filling up...' : 'They multiply.', '#ff8a1f', 1500);
    beep(260, .3, 'triangle', .05, 200);
  }

  if (isTouch) {
    if (Math.hypot(touch.ax, touch.az) > .15) aimDir.set(touch.ax, 0, touch.az).normalize();
    aimPoint.set(player.position.x + aimDir.x * 10, 0, player.position.z + aimDir.z * 10);
  } else {
    raycaster.setFromCamera(mouseNDC, camera);
    raycaster.ray.intersectPlane(groundPlane, aimPoint);
  }

  let ix = (keys['d'] || keys['arrowright'] ? 1 : 0) - (keys['a'] || keys['arrowleft'] ? 1 : 0);
  let iz = (keys['s'] || keys['arrowdown'] ? 1 : 0) - (keys['w'] || keys['arrowup'] ? 1 : 0);
  if (Math.hypot(touch.mx, touch.mz) > .12) { ix = touch.mx; iz = touch.mz; }
  const il = Math.max(1, Math.hypot(ix, iz)); ix /= il; iz /= il;
  const speed = muse ? 5.6 : 10, acc = muse ? 4 : 16;
  const f = 1 - Math.exp(-acc * dt);
  G.vel.x = lerp(G.vel.x, ix * speed, f); G.vel.z = lerp(G.vel.z, iz * speed, f);
  if (muse) { G.vel.x += Math.sin(G.t * 3.1) * 6 * dt; G.vel.z += Math.cos(G.t * 2.7) * 6 * dt; } // drift
  const npx = player.position.x + G.vel.x * dt, npz = player.position.z + G.vel.z * dt;
  if (!hitsWall(npx, player.position.z, 1)) player.position.x = npx; else G.vel.x = 0;
  if (!hitsWall(player.position.x, npz, 1)) player.position.z = npz; else G.vel.z = 0;
  player.rotation.y = Math.atan2(aimPoint.x - player.position.x, aimPoint.z - player.position.z);
  player.position.y = Math.abs(Math.sin(G.t * 10)) * .1 * Math.min(1, Math.hypot(G.vel.x, G.vel.z) / 5);
  player.visible = G.invuln <= 0 || Math.floor(G.t * 16) % 2 === 0;
  G.invuln -= dt;

  if (!muse) {
    G.tokens -= (3.4 + wave * .38) * dt;
    G.beepCd -= dt;
    if (G.tokens < 20 && G.beepCd <= 0) { beep(880, .08, 'square', .04); G.beepCd = .5; }
    if (G.tokens <= 0) { G.tokens = 0; setMuse(true); }
  } else {
    G.museTime += dt;
    G.whisperCd -= dt;
    if (G.whisperCd <= 0) { whisper(pick(WHISPERS)); G.whisperCd = rand(7, 11); }
  }

  G.fireCd -= dt;
  if ((mouseDown || keys[' '] || Math.hypot(touch.ax, touch.az) > .3) && G.fireCd <= 0 && state === 'play') {
    if (!G.muse && G.tokens < .7) { G.tokens = 0; setMuse(true); } else fire();
  }

  if (G.comboT > 0) { G.comboT -= dt; if (G.comboT <= 0) G.combo = 0; }

  G.spawnCd -= dt;
  if (G.spawnCd <= 0) {
    G.spawnCd = Math.max(.32, 1.5 - wave * .1);
    if (enemies.length < 10 + wave * 2.5) {
      const r = Math.random();
      let type = 'limit';
      if (wave >= 3 && r < Math.min(.12, wave * .02)) type = 'overflow';
      else if (wave >= 2 && r < .15 + Math.min(.3, wave * .03)) type = 'e429';
      spawnEnemy(type);
      if (wave >= 6 && Math.random() < .35) spawnEnemy('e429');
    }
  }
  G.orbCd -= dt;
  if (G.orbCd <= 0) {
    G.orbCd = muse ? 2.6 : 4.5;
    if (orbs.filter(o => !o.fake && o.kind === 'tok').length < (muse ? 4 : 3)) spawnOrb(false);
  }
  if (muse) {
    G.fakeCd -= dt;
    if (G.fakeCd <= 0) { G.fakeCd = 1.7; if (orbs.filter(o => o.fake).length < 5) spawnOrb(true); }
  }
  G.clockCd -= dt;
  if (G.clockCd <= 0) { G.clockCd = rand(30, 40); if (!orbs.some(o => o.kind === 'clock')) spawnClock(); }

  // bullets
  for (let i = bullets.length - 1; i >= 0; i--) {
    const b = bullets[i];
    b.mesh.position.x += b.vx * dt; b.mesh.position.z += b.vz * dt; b.life -= dt;
    let dead = b.life <= 0 || wallAt(cellOf(b.mesh.position.x), cellOf(b.mesh.position.z));
    if (dead && b.life > 0) burst(b.mesh.position, 0x3dff8a, 3, 3);
    if (!dead) for (let j = enemies.length - 1; j >= 0; j--) {
      const e = enemies[j];
      if (b.hit.has(e)) continue;
      if (Math.hypot(e.mesh.position.x - b.mesh.position.x, e.mesh.position.z - b.mesh.position.z) < e.r + .25) {
        b.hit.add(e); e.hp--; e.kx += b.vx * .04; e.kz += b.vz * .04;
        burst(b.mesh.position, 0xffffff, 3, 3);
        if (e.hp <= 0) killEnemy(e, j); else beep(500, .04, 'square', .02);
        if (--b.pierce <= 0) { dead = true; break; }
      }
    }
    if (dead) { scene.remove(b.mesh); bullets.splice(i, 1); }
  }

  // enemies
  const pp = player.position, boost = 1 + Math.min(.9, wave * .05) + (muse ? .12 : 0);
  updateFlow();
  for (let i = 0; i < enemies.length; i++) {
    const e = enemies[i], m = e.mesh;
    const dx = pp.x - m.position.x, dz = pp.z - m.position.z, d = Math.hypot(dx, dz) || 1;
    const dir = chaseDir(m.position, dx, dz, d);
    const vx = dir.x * e.speed * boost + e.kx, vz = dir.z * e.speed * boost + e.kz;
    e.kx *= Math.exp(-6 * dt); e.kz *= Math.exp(-6 * dt);
    for (let j = i + 1; j < enemies.length; j++) {
      const o = enemies[j], sx = m.position.x - o.mesh.position.x, sz = m.position.z - o.mesh.position.z, sd = Math.hypot(sx, sz);
      const min = e.r + o.r;
      if (sd > 0 && sd < min) {
        const push = (min - sd) * 3 * dt;
        m.position.x += sx / sd * push; m.position.z += sz / sd * push;
        o.mesh.position.x -= sx / sd * push; o.mesh.position.z -= sz / sd * push;
      }
    }
    const rr = Math.min(e.r * .8, 1.3), gx = m.position.x + vx * dt, gz = m.position.z + vz * dt;
    if (!hitsWall(gx, m.position.z, rr)) m.position.x = gx; else e.kx = 0;
    if (!hitsWall(m.position.x, gz, rr)) m.position.z = gz; else e.kz = 0;
    m.position.y = .35 + Math.sin(G.t * 3 + e.phase) * .25;
    m.rotation.y = Math.atan2(dx, dz);
    if (d < e.r + .6) { hurt(); e.kx -= dx / d * 14; e.kz -= dz / d * 14; }
  }

  // orbs / pickups
  for (let i = orbs.length - 1; i >= 0; i--) {
    const o = orbs[i], m = o.mesh;
    o.life -= dt; o.ph += dt * 3;
    if (o.kind === 'clock') { m.rotation.y += dt * 2; m.position.y = 1.3 + Math.sin(o.ph) * .25; }
    else {
      m.rotation.y += dt * 2; m.position.y = 1 + Math.sin(o.ph) * .2;
      if (o.fake) {
        m.visible = Math.random() > .22;
        m.position.x += rand(-.02, .02); m.position.z += rand(-.02, .02);
        m.scale.setScalar(1 + Math.sin(o.ph * 8) * .08);
      } else if (o.life < 3) m.visible = Math.floor(o.life * 8) % 2 === 0;
    }
    if (o.life <= 0) { popOrb(o, i); continue; }
    if (Math.hypot(m.position.x - pp.x, m.position.z - pp.z) < 1.5) {
      if (o.kind === 'clock') {
        popOrb(o, i);
        G.tokens = 100; G.resets++; G.score += 100;
        for (let j = enemies.length - 1; j >= 0; j--) {
          const e = enemies[j];
          e.hp -= 3;
          if (e.hp <= 0) killEnemy(e, j);
          else { const dx = e.mesh.position.x - pp.x, dz = e.mesh.position.z - pp.z, d = Math.hypot(dx, dz) || 1; e.kx += dx / d * 18; e.kz += dz / d * 18; }
        }
        flash('#5ad7ff', .6); G.shake = 1.5;
        beep(400, .5, 'triangle', .07, 900);
        if (G.muse) setMuse(false); else banner('LIMIT RESET', 'Your 5 hours are up. Ghosts are not.', '#5ad7ff', 1600);
      } else if (o.fake) {
        popOrb(o, i); hurt(); whisper('Hallucinated token. Muse: "That was definitely real."'); beep(100, .25, 'sawtooth', .06, 60);
      } else {
        popOrb(o, i);
        G.tokens = Math.min(100, G.tokens + 18); G.score += 5; pushToken();
        beep(900, .09, 'triangle', .05, 500);
        if (G.muse && G.tokens >= 25) setMuse(false);
      }
    }
  }

  // pellets (little tokens along the corridors)
  for (let i = pellets.length - 1; i >= 0; i--) {
    const pm = pellets[i].mesh;
    if (Math.hypot(pm.position.x - pp.x, pm.position.z - pp.z) < 1.3) {
      scene.remove(pm); pellets.splice(i, 1);
      G.score += 1; G.tokens = Math.min(100, G.tokens + 1.5); G.waka = !G.waka;
      $('bar').classList.add('gain'); clearTimeout(gainT); gainT = setTimeout(() => $('bar').classList.remove('gain'), 160);
      if (G.t > 12) teach('dots','SMALL TOKENS ADD UP', 'Each dot refills a little (+1.5). Orange orbs refill a lot (+18). Short, focused prompts are like dots: cheap, and they keep you moving.');
      beep(G.waka ? 330 : 260, .04, 'triangle', .018);
      if (G.muse && G.tokens >= 25) setMuse(false);
    }
  }
  if (!pellets.length) {
    G.score += 500; spawnPellets();
    banner('BOARD CLEARED', '+500. Fresh context, fresh dots.', '#3dff8a', 1600); beep(500, .4, 'triangle', .06, 600);
    teach('clear', 'LIKE /clear', 'Wiping the board is like /clear: start the next task with a clean context instead of dragging old baggage along.');
  }

  // particles
  for (let i = parts.length - 1; i >= 0; i--) {
    const p = parts[i]; p.life -= dt; p.vy -= 18 * dt;
    p.mesh.position.x += p.vx * dt; p.mesh.position.z += p.vz * dt; p.mesh.position.y += p.vy * dt;
    if (p.mesh.position.y < .1) { p.mesh.position.y = .1; p.vy = 0; }
    p.mesh.material.opacity = Math.max(0, p.life / p.max);
    if (p.life <= 0) { scene.remove(p.mesh); p.mesh.material.dispose(); parts.splice(i, 1); }
  }

  updateHUD();
}

/* ---------- render ---------- */
let last = performance.now(), time = 0;
function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min(.05, (now - last) / 1000); last = now; time += dt;
  if (state === 'play' && !paused) update(dt);
  const mv = state === 'play' ? G.mv : 0;

  // lighting reacts to mode: Claude = bright, Muse = tiny dim flickering radius
  pLight.position.set(player.position.x, 3.2, player.position.z);
  pLight.distance = lerp(32, 9, mv);
  pLight.intensity = lerp(2.4, 1.4, mv) * (1 + (mv > .5 ? Math.sin(time * 40) * .12 * Math.random() : 0));
  pLight.color.setHex(mv > .5 ? 0xb36bff : 0xff8a1f);
  ambient.intensity = lerp(.7, .15, mv);
  scene.fog.density = lerp(.016, .07, mv);
  cornerLights.forEach((l, i) => { l.intensity = (1 + Math.sin(time * 5 + i) * .25) * lerp(1.3, .3, mv); });
  grid.material.opacity = lerp(.55, .22, mv);
  border.material.color.setHex(mv > .5 ? 0xb36bff : 0x3dff8a);
  edgeMat.color.copy(border.material.color);

  let sh = 0;
  if (state === 'play') { sh = G.shake; G.shake = Math.max(0, G.shake - dt * 3); }
  const idle = state !== 'play';
  const tx = idle ? 0 : player.position.x * .85, tz = idle ? 0 : player.position.z * .85;
  const cx = idle ? Math.sin(time * .15) * 20 : tx, cz = idle ? 14 + Math.cos(time * .15) * 6 : tz + 15;
  const k = 1 - Math.exp(-6 * dt);
  camera.position.x = lerp(camera.position.x, cx, k) + (sh ? rand(-sh, sh) * .3 : 0);
  camera.position.z = lerp(camera.position.z, cz, k) + (sh ? rand(-sh, sh) * .3 : 0);
  camera.position.y = lerp(camera.position.y, idle ? 26 : 27 + mv * 3, 1 - Math.exp(-3 * dt));
  camera.lookAt(tx, 0, tz);
  camera.rotation.z += mv * Math.sin(time * 1.3) * .03;
  player.userData.cursor.visible = Math.floor(time * 2) % 2 === 0;
  // Clawd desaturates to a sad purple-grey in Muse mode; legs scurry when moving
  const sk = player.userData.skin;
  sk.color.setHex(0xd97757).lerp(new THREE.Color(0x7a6a96), mv); sk.emissive.copy(sk.color);
  const moving = state === 'play' ? Math.min(1, Math.hypot(G.vel.x, G.vel.z) / 4) : 0;
  player.userData.legs.forEach((l, i) => { l.scale.y = 1 - moving * .3 * (Math.sin(time * 18 + i * 1.6) * .5 + .5); l.position.y = .4 * l.scale.y; });

  renderer.render(scene, camera);
}

newGame();
titleScreen();
requestAnimationFrame(frame);
})();
</script>
</body>
